name: croppulse_mobile
description: CropPulse - Agricultural Operating System (Mobile)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^13.0.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # UI & Components
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  animate_do: ^3.0.0

  # Charts & Data Visualization
  fl_chart: ^0.64.0
  charts_flutter: ^0.12.0

  # Forms & Validation
  form_validator: ^2.1.0

  # Authentication
  local_auth: ^2.1.0

  # Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.0

  # Analytics
  firebase_analytics: ^10.7.0

  # Device Info
  device_info_plus: ^9.1.0
  package_info_plus: ^5.0.0

  # Connectivity
  connectivity_plus: ^5.0.0

  # Location
  geolocator: ^9.0.0

  # Date/Time
  intl: ^0.19.0

  # Logging
  logger: ^2.0.0

  # Error Handling
  sentry_flutter: ^7.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
