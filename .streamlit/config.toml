[theme]
primaryColor = "#2ecc71"
backgroundColor = "#f8f9fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#2c3e50"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[browser]
gatherUsageStats = false

[server]
port = 8501
headless = true
runOnSave = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
