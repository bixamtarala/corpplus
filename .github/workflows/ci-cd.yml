name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pylint
    
    - name: Lint with pylint
      continue-on-error: true
      run: |
        pylint streamlit_app_phase2.py --disable=all --enable=E,F || true
    
    - name: Check syntax with Python
      run: |
        python -m py_compile streamlit_app_phase2.py
    
    - name: Test imports
      run: |
        python -c "import streamlit; import pandas; import plotly; import db_config; print('✓ All imports successful')"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Streamlit Cloud
      run: |
        echo "✓ Deployment triggered"
        echo "Streamlit Cloud will automatically redeploy from main branch"
        echo "App: https://corpplus.streamlit.app"
