name: Mobile Android Delivery

'on':
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile_app_flutter

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: stable
        cache: true

    - name: Flutter pub get
      run: flutter pub get

    - name: Build Android release APK
      run: flutter build apk --release

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: croppulse-android-apk-${{ github.run_number }}
        path: mobile_app_flutter/build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error
        retention-days: 14

    - name: Publish rolling GitHub release
      uses: ncipollo/release-action@v1
      with:
        tag: mobile-latest
        name: CropPulse Android Latest
        prerelease: true
        allowUpdates: true
        replacesArtifacts: true
        artifactErrorsFailBuild: true
        artifacts: mobile_app_flutter/build/app/outputs/flutter-apk/app-release.apk
        body: |
          Latest Android APK for CropPulse.

          Commit: `${{ github.sha }}`
          Workflow run: `${{ github.run_number }}`
          Triggered by: `${{ github.event_name }}`

          Download the attached `app-release.apk` artifact from this prerelease.
