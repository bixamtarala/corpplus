name: Mobile Android Delivery

'on':
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
      CROPPULSE_PLAY_STORE_URL: ${{ vars.CROPPULSE_PLAY_STORE_URL }}

    defaults:
      run:
        working-directory: mobile_app_flutter

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: stable
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Read mobile version
      id: mobile_version
      run: |
        version_line=$(grep '^version:' pubspec.yaml | awk '{print $2}')
        version_name="${version_line%%+*}"
        version_code="${version_line##*+}"

        echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
        echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

    - name: Prepare Android signing files
      if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
      run: |
        mkdir -p keystore
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/croppulse-upload.jks

        cat > android/key.properties <<EOF
        storeFile=../keystore/croppulse-upload.jks
        storePassword=$ANDROID_KEYSTORE_PASSWORD
        keyAlias=$ANDROID_KEY_ALIAS
        keyPassword=$ANDROID_KEY_PASSWORD
        EOF

    - name: Flutter pub get
      run: flutter pub get

    - name: Build Android release APK
      run: flutter build apk --release

    - name: Build Android release App Bundle
      if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
      run: flutter build appbundle --release

    - name: Generate update metadata
      run: |
        mkdir -p build/update
        published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        play_store_url="$CROPPULSE_PLAY_STORE_URL"

        if [ -z "$play_store_url" ]; then
          play_store_url='https://play.google.com/store/apps/details?id=com.croppulse.mobile'
        fi

        cat > build/update/update-metadata.json <<EOF
        {
          "app": "CropPulse",
          "package_name": "com.croppulse.mobile",
          "version_name": "${{ steps.mobile_version.outputs.version_name }}",
          "version_code": ${{ steps.mobile_version.outputs.version_code }},
          "download_url": "https://github.com/${{ github.repository }}/releases/download/mobile-latest/app-release.apk",
          "play_store_url": "$play_store_url",
          "release_notes": "CropPulse ${{ steps.mobile_version.outputs.version_name }} (${{ steps.mobile_version.outputs.version_code }}) built from commit ${{ github.sha }}",
          "published_at": "$published_at",
          "force_update": false
        }
        EOF

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: croppulse-android-apk-${{ github.run_number }}
        path: mobile_app_flutter/build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload AAB artifact
      if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: croppulse-android-aab-${{ github.run_number }}
        path: mobile_app_flutter/build/app/outputs/bundle/release/app-release.aab
        if-no-files-found: error
        retention-days: 14

    - name: Upload update metadata artifact
      uses: actions/upload-artifact@v4
      with:
        name: croppulse-update-metadata-${{ github.run_number }}
        path: mobile_app_flutter/build/update/update-metadata.json
        if-no-files-found: error
        retention-days: 14

    - name: Publish rolling GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        body=$(cat <<'EOF'
        Latest Android release assets for CropPulse.

        Version: `${{ steps.mobile_version.outputs.version_name }} (${{ steps.mobile_version.outputs.version_code }})`
        Commit: `${{ github.sha }}`
        Workflow run: `${{ github.run_number }}`
        Triggered by: `${{ github.event_name }}`

        Assets:
        - `app-release.apk` for side-load installs and Firebase App Distribution
        - `update-metadata.json` for in-app update checks
        - `app-release.aab` when signing secrets are configured for Play internal testing
        EOF
        )

        if gh release view mobile-latest >/dev/null 2>&1; then
          gh release edit mobile-latest \
            --title "CropPulse Android Latest" \
            --notes "$body" \
            --target "${{ github.sha }}" \
            --prerelease
        else
          gh release create mobile-latest \
            --title "CropPulse Android Latest" \
            --notes "$body" \
            --target "${{ github.sha }}" \
            --prerelease
        fi

        assets=(
          build/app/outputs/flutter-apk/app-release.apk
          build/update/update-metadata.json
        )

        if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
          assets+=(build/app/outputs/bundle/release/app-release.aab)
        fi

        gh release upload mobile-latest "${assets[@]}" --clobber

    - name: Install Firebase CLI
      if: ${{ env.FIREBASE_APP_ID_ANDROID != '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
      run: npm install --global firebase-tools

    - name: Distribute APK to Firebase App Distribution
      if: ${{ env.FIREBASE_APP_ID_ANDROID != '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
      run: |
        credentials_path="$RUNNER_TEMP/firebase-service-account.json"
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_path"
        export GOOGLE_APPLICATION_CREDENTIALS="$credentials_path"

        groups="$FIREBASE_TESTER_GROUPS"
        if [ -z "$groups" ]; then
          groups='internal-testers'
        fi

        firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
          --app "$FIREBASE_APP_ID_ANDROID" \
          --groups "$groups" \
          --release-notes "CropPulse ${{ steps.mobile_version.outputs.version_name }} (${{ steps.mobile_version.outputs.version_code }}) - ${{ github.sha }}"

    - name: Upload App Bundle to Google Play internal testing
      if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.croppulse.mobile
        releaseFiles: mobile_app_flutter/build/app/outputs/bundle/release/app-release.aab
        track: internal
        status: completed
